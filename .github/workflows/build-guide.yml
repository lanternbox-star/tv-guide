name: Build TV guide

on:
  schedule:
    - cron: "17 */6 * * *"   # about every 6 hours (GitHub may run it a little late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions: {}               # nothing by default; each job asks for only what it needs

concurrency:
  group: tv-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build guide
        run: python3 build_guide.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  keepalive:
    # GitHub switches off schedules after 60 days with no repository activity.
    # This makes one tiny commit a month so the schedule keeps running.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Monthly heartbeat
        run: |
          month="$(date -u +%Y-%m)"
          if [ "$(cat last-build.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > last-build.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-build.txt
            git commit -m "Monthly heartbeat $month"
            git push
          fi
